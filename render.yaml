services:
  - type: web
    name: mel-ia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_MODEL
        value: auto
      - key: ASSISTANT_NAME
        value: MEL-IA
    disk:
      name: mel-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
