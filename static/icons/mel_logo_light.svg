<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 256" width="560" height="256" fill="none" role="img" aria-label="MEL-IA 2.0 Logo">
  <defs>
    <!-- Filtres d'ombrage 3D & Profondeur Studio -->
    <filter id="mel-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="mel-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dgrads Mtalliques Platine / Argent -->
    <linearGradient id="silver-top" x1="160" y1="40" x2="310" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#E2E8F0" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="silver-bottom" x1="150" y1="360" x2="320" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="silver-right" x1="330" y1="170" x2="415" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Dgrads Cyan Ocanique & Teal Vibrant -->
    <linearGradient id="teal-wing-1" x1="110" y1="160" x2="230" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="40%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#044E54" />
    </linearGradient>

    <linearGradient id="teal-wing-2" x1="90" y1="260" x2="310" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="55%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#023E42" />
    </linearGradient>

    <!-- Reflets Spculaires Luminescents -->
    <linearGradient id="rim-cyan" x1="340" y1="170" x2="300" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
  </defs>

  <!-- Symbole Central (Scale to fit in 256x256, center at 128,128) -->
  <g transform="translate(128, 128) scale(0.48) translate(-256, -256)" filter="url(#mel-shadow)">
    <!-- 1. Aile Cyan Ocanique Infrieure (Profondeur) -->
    <path d="M 84 262 C 86 312, 136 376, 218 395 C 265 405, 305 385, 318 376 C 248 372, 185 334, 150 286 C 122 248, 106 200, 112 152 C 90 200, 82 232, 84 262 Z"
          fill="url(#teal-wing-2)" />

    <!-- 2. Aile Cyan Ocanique Mdiane (Vibrante) -->
    <path d="M 112 150 C 96 215, 120 288, 172 328 C 220 365, 276 355, 312 338 C 240 338, 182 292, 162 234 C 146 188, 158 136, 178 94 C 138 106, 118 126, 112 150 Z"
          fill="url(#teal-wing-1)" />

    <!-- 3. Croissant Argent Infrieur (Base vortex) -->
    <path d="M 144 384 C 196 424, 268 428, 314 416 C 352 406, 386 374, 404 336 C 362 382, 296 408, 232 400 C 188 394, 158 376, 144 384 Z"
          fill="url(#silver-bottom)" />

    <!-- 4. Grand Arc Spiral Suprieur (Argent / Platine 3D) -->
    <path d="M 256 42 C 172 44, 130 92, 130 160 C 130 236, 194 286, 268 284 C 304 283, 310 262, 292 258 C 238 246, 184 204, 184 146 C 184 96, 222 62, 276 62 C 316 62, 338 84, 344 112 C 342 78, 314 44, 256 42 Z"
          fill="url(#silver-top)" />

    <!-- 5. Aile Droite Pivotante (Argent avec liser cyan) -->
    <path d="M 334 162 C 352 232, 350 334, 300 422 C 374 382, 412 306, 412 242 C 412 178, 384 136, 334 162 Z"
          fill="url(#silver-right)" />

    <!-- Liser non cyan sur l'arte de l'aile droite -->
    <path d="M 336 172 C 350 238, 348 334, 302 420"
          stroke="url(#rim-cyan)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95" />
  </g>
  <!-- Typographie MEL-IA 2.0 Studio -->
  <g transform="translate(268, 142)">
    <text x="0" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" letter-spacing="-0.03em" fill="#0F172A">
      MEL<tspan fill="#06B6D4">-IA</tspan>
    </text>
    <text x="4" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" letter-spacing="0.22em" fill="#64748B">
      STUDIO INTELLIGENCE
    </text>
  </g>
</svg>